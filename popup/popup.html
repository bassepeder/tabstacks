<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <label class="search">
        <span data-icon="search"></span>
        <input id="filter" type="text" placeholder="Filter stacks" autocomplete="off" spellcheck="false" />
      </label>
      <button id="stack-selected" class="icon" data-icon="stack"></button>
      <button id="stack-by-site" class="icon" data-icon="globe"></button>
    </header>
    <main id="stacks"></main>
    <footer>
      <span id="hint"></span>
      <button id="expand-all" class="icon" data-icon="expand" title="Expand all stacks"></button>
      <button id="collapse-all" class="icon" data-icon="collapse" title="Collapse all stacks"></button>
      <button id="settings" class="icon" data-icon="sliders" title="Settings"></button>
    </footer>
    <script src="../shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
